name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l cmd internal)" && go test -race ./... && go vet ./...
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
          no-cache: true
      - name: Verify the history chart
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run format:check
          bun run typecheck
          bun run test
          bun run build:check
  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify runtime and deployment without model weights
        run: |
          python3 -m unittest discover -s runtime/npu
          python3 -m unittest discover -s tests
      - name: Launch empty inventory
        run: |
          cp models.example.json models.json
          docker compose up --build -d
          curl --retry 15 --retry-all-errors --fail http://127.0.0.1:8317/v1/models | jq -e '.data == []'
          curl --fail http://127.0.0.1:8317/ >/dev/null
          curl --fail --silent http://127.0.0.1:8317/history-chart.js >/dev/null
      - if: always()
        run: docker compose down --volumes
  automerge:
    needs: [checks, containers]
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Merge the labeled, tested head and base
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.number }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          current=$(gh api "$repo/pulls/$PR")
          jq -e --arg head "$HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .draft == false and .head.sha == $head and
            .head.repo.full_name == $repo and .base.ref == "develop" and
            any(.labels[]; .name == "automerge")' <<< "$current" >/dev/null || exit 0
          test "$(gh api "$repo/git/ref/heads/develop" --jq .object.sha)" = "$BASE_SHA"
          gh api "$repo/git/commits/$GITHUB_SHA" | jq -e --arg b "$BASE_SHA" --arg h "$HEAD_SHA" '[.parents[].sha] == [$b,$h]'
          gh api --method PUT "$repo/pulls/$PR/merge" -f sha="$HEAD_SHA" -f merge_method=merge | jq -e .merged
