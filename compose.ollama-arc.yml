# Optional Intel Arc runtime. Use with the base Compose file and the arc profile.
services:
  ollama:
    profiles: !override [arc]
    image: models-configurator-ollama-intel:0.40.16
    build:
      context: .
      dockerfile: Dockerfile.ollama-intel
    devices:
      - ${MODELS_OLLAMA_DRI_DEVICE:-/dev/dri/renderD128}:${MODELS_OLLAMA_DRI_DEVICE:-/dev/dri/renderD128}:rw
    group_add:
      - ${MODELS_OLLAMA_RENDER_GID:?Set the numeric group of the selected Intel render node}
    environment:
      OLLAMA_VULKAN: '1'
      OLLAMA_IGPU_ENABLE: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      CUDA_VISIBLE_DEVICES: '-1'
      ROCR_VISIBLE_DEVICES: '-1'
      VK_DRIVER_FILES: /etc/models-configurator-intel-vulkan.json
      VK_ICD_FILENAMES: /etc/models-configurator-intel-vulkan.json
      GGML_VK_VISIBLE_DEVICES: '0'
