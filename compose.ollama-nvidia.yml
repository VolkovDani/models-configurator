# Use with compose.yml and the nvidia profile on a host with NVIDIA Container Toolkit.
services:
  ollama:
    profiles: !override [nvidia]
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${MODELS_OLLAMA_GPU_UUID:?Set the selected NVIDIA GPU UUID from nvidia-smi}"]
              capabilities: [gpu]
    environment:
      OLLAMA_VULKAN: '0'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
